name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm run validate
        if: github.event_name == 'push'
      - run: npm run validate -- --base "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'
      - run: npm test

  copilot-contract:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global @github/copilot@1.0.91
      - run: npm run test:copilot
